<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0f">
<title>Phone</title>
<style>
/* ================== THEME ================== */
:root{
  --bg:#0b0b0f; --screen:#f2f2f7; --panel:#ffffff; --ink:#111; --muted:#8a8a8e;
  --line:#dcdce0; --me:#0a84ff; --them:#e5e5ea; --green:#34c759; --red:#ff3b30;
  --home-gap:26px; /* room for the home indicator */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center}
#phone{position:relative;width:100%;height:100%;overflow:hidden;background:var(--screen)}
@media (min-width:600px){
  #phone{width:390px;height:800px;border-radius:44px;border:12px solid #1c1c1e;box-shadow:0 30px 80px rgba(0,0,0,.6)}
}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}
button{font-family:inherit}

/* ================== LOCK SCREEN ================== */
#lock{background:radial-gradient(ellipse at 30% 20%,#2b4a6b 0%,#14243a 45%,#070b12 100%);color:#fff;align-items:center;padding:env(safe-area-inset-top) 20px 30px}
#lock .clock{margin-top:9vh;font-size:76px;font-weight:200;letter-spacing:-2px}
#lock .date{font-size:17px;opacity:.85;margin-top:-4px}
#lock .prompt{margin-top:5vh;font-size:16px;opacity:.9}
#dots{display:flex;gap:18px;margin:18px 0 28px}
#dots span{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff;transition:background .15s}
#dots span.on{background:#fff}
#dots.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
#pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px}
#pad button{width:78px;height:78px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:32px;font-weight:300;cursor:pointer}
#pad button:active{background:rgba(255,255,255,.4)}
#pad button.blank{background:none;pointer-events:none}
#pad button.del{background:none;font-size:16px}

/* ================== HOME SCREEN ================== */
#home{background:radial-gradient(ellipse at 70% 10%,#3f7fa8 0%,#1d4b6e 40%,#0c2236 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + var(--home-gap))}
.widget{background:rgba(255,255,255,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:14px 16px;margin:6px 4px 22px}
.widget .w-day{font-size:13px;font-weight:600;color:#ffd36b;text-transform:uppercase}
.widget .w-date{font-size:34px;font-weight:300;line-height:1.1}
.widget .w-sub{font-size:13px;opacity:.85;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative;background:none;border:none;color:#fff}
.app .ico{width:60px;height:60px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.app .lbl{font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.app .appbadge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:13px;font-weight:600;display:none;align-items:center;justify-content:center;padding:0 6px}
.app.wiggle .ico{animation:wig .35s}
@keyframes wig{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.dock{margin-top:auto;background:rgba(255,255,255,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:28px;padding:14px 10px;display:grid;grid-template-columns:repeat(4,1fr);justify-items:center}
.dock .lbl{display:none}

/* ================== HOME INDICATOR ================== */
#homebar{position:absolute;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom) + 22px);display:none;align-items:flex-start;justify-content:center;padding-top:8px;z-index:50;cursor:pointer}
#homebar i{width:134px;height:5px;border-radius:3px;background:rgba(0,0,0,.8)}
#homebar.light i{background:rgba(255,255,255,.85)}

/* ================== NOTIFICATION BANNER ================== */
#banner{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 8px);z-index:60;background:rgba(245,245,247,.97);border-radius:18px;padding:11px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25);transform:translateY(-150%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);cursor:pointer}
#banner.show{transform:none}
#banner .ico{width:36px;height:36px;border-radius:9px;background:linear-gradient(#65e36f,#2fbf45);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
#banner .b-title{font-weight:600;font-size:14px}
#banner .b-text{font-size:14px;color:#333;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ================== LIST SCREENS (Contacts / Messages) ================== */
.navbar{padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;background:var(--panel)}
.navbar .row{display:flex;justify-content:space-between;align-items:center;min-height:28px}
.navbar h1{font-size:32px;font-weight:700;margin-top:4px}
.link{background:none;border:none;color:var(--me);font-size:17px;cursor:pointer;padding:2px 0}
.search{margin-top:8px;display:flex;align-items:center;gap:6px;background:#eeeef0;border-radius:10px;padding:8px 10px;color:var(--muted)}
.search input{flex:1;border:none;background:none;font-size:16px;outline:none;font-family:inherit;color:var(--ink)}
.list{flex:1;overflow-y:auto;background:var(--panel);padding-bottom:var(--home-gap)}
.section{padding:3px 16px;font-size:14px;font-weight:600;color:var(--muted);background:#f6f6f7}
.crow{padding:11px 16px;border-bottom:1px solid #ececef;font-size:17px;cursor:pointer}
.crow b{font-weight:600}
.crow:active,.thread:active{background:#e9e9ee}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}
.thread{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid #ececef;cursor:pointer}
.thread .unread-dot{width:10px;height:10px;border-radius:50%;background:var(--me);flex-shrink:0;visibility:hidden}
.thread.unread .unread-dot{visibility:visible}
.thread .t-main{flex:1;min-width:0}
.thread .t-top{display:flex;justify-content:space-between}
.thread .t-name{font-weight:600;font-size:16px}
.thread .t-time{font-size:14px;color:var(--muted)}
.thread .t-last{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(#a0a4ad,#7d818a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;flex-shrink:0}

/* ================== CONTACT CARD ================== */
#card{background:var(--screen)}
#card .top{background:linear-gradient(#e9e9ee,#f2f2f7);padding:calc(env(safe-area-inset-top) + 10px) 16px 20px;text-align:center}
#card .top .row{display:flex;justify-content:space-between}
#card .big{width:96px;height:96px;font-size:36px;margin:10px auto 10px}
#card .c-name{font-size:28px;font-weight:600}
#card .actions{display:flex;gap:8px;justify-content:center;margin-top:16px}
#card .act{width:78px;background:#fff;border:none;border-radius:12px;padding:9px 0 7px;color:var(--me);font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
#card .act span{font-size:20px}
#card .act.off{color:#b3b3b8;cursor:default}
#card .fields{margin:12px 16px;background:#fff;border-radius:12px;overflow:hidden}
#card .field{padding:10px 14px;border-bottom:1px solid #ececef}
#card .field:last-child{border-bottom:none}
#card .f-label{font-size:13px;color:var(--ink)}
#card .f-value{font-size:17px;color:var(--me);margin-top:2px}
#card .f-value.plain{color:var(--ink);font-size:15px;white-space:pre-wrap}

/* ================== CHAT ================== */
.chathead{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:rgba(249,249,249,.95);border-bottom:1px solid var(--line)}
.chathead .avatar{width:34px;height:34px;font-size:13px}
.chathead .who{font-weight:600;font-size:16px}
.chathead .status{font-size:12px;color:var(--muted)}
#msgs{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:4px;background:#fff}
.bubble{flex-shrink:0;max-width:78%;padding:9px 13px;border-radius:19px;font-size:16px;line-height:1.3;white-space:pre-wrap;word-wrap:break-word;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.me{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:6px}
.them{align-self:flex-start;background:var(--them);border-bottom-left-radius:6px}
.them a{color:var(--me);font-weight:600}
.bubble.photo{padding:0;overflow:hidden;background:none;width:78%;max-width:320px}
.bubble.photo img{display:block;width:100%;border-radius:17px}
.sysnote{align-self:center;font-size:12px;color:var(--muted);margin:8px 0;text-align:center}
.failed{align-self:flex-end;font-size:12px;color:var(--red);margin:-1px 4px 6px}
.typing{align-self:flex-start;background:var(--them);border-radius:19px;padding:12px 14px;display:flex;gap:4px}
.typing i{width:8px;height:8px;border-radius:50%;background:#999;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.action{align-self:center;margin:10px 0;padding:11px 18px;border-radius:22px;border:none;background:var(--green);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#composer{display:flex;gap:8px;padding:8px 10px calc(env(safe-area-inset-bottom) + var(--home-gap));background:#f9f9f9;border-top:1px solid var(--line)}
#input{flex:1;border:1px solid var(--line);border-radius:20px;padding:9px 14px;font-size:16px;font-family:inherit;resize:none;max-height:120px;outline:none;background:#fff}
#send{width:36px;height:36px;border-radius:50%;border:none;background:var(--me);color:#fff;font-size:18px;cursor:pointer;align-self:flex-end}
#send:disabled{background:#b8d6fb}
#gpsbar{display:none;align-items:center;gap:8px;padding:7px 12px;font-size:13px;background:#eaf8ee;color:#1d6b34;border-top:1px solid #cdebd6}
#gpsbar .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 1.6s infinite}
#gpsbar button{margin-left:auto;border:none;background:none;color:var(--me);font-size:13px;font-weight:600;cursor:pointer}

/* ================== DEBUG ================== */
#debug{position:fixed;bottom:8px;left:8px;z-index:99;display:none;gap:6px;flex-wrap:wrap;max-width:360px}
#debug button{font-size:12px;padding:6px 8px;border-radius:6px;border:none;background:#ffcc00;cursor:pointer}
#debug .info{font-size:11px;color:#fff;background:rgba(0,0,0,.7);padding:4px 6px;border-radius:6px;width:100%}
</style>
</head>
<body>
<div id="phone">

  <!-- LOCK SCREEN -->
  <section id="lock" class="screen active">
    <div class="clock" id="clock">9:41</div>
    <div class="date" id="date"></div>
    <div class="prompt">Enter Passcode</div>
    <div id="dots"><span></span><span></span><span></span><span></span></div>
    <div id="pad"></div>
  </section>

  <!-- HOME SCREEN -->
  <section id="home" class="screen">
    <div class="widget">
      <div class="w-day" id="wDay"></div>
      <div class="w-date" id="wDate"></div>
      <div class="w-sub">Bondi · 21° · Light southerly</div>
    </div>
    <div class="grid" id="appGrid"></div>
    <div class="dock" id="dock"></div>
  </section>

  <!-- CONTACTS -->
  <section id="contacts" class="screen">
    <div class="navbar">
      <div class="row"><button class="link back-btn">‹ Home</button><span></span></div>
      <h1>Contacts</h1>
      <div class="search">🔍<input id="csearch" type="search" placeholder="Search" autocomplete="off"></div>
    </div>
    <div class="list" id="contactList"></div>
  </section>

  <!-- CONTACT CARD -->
  <section id="card" class="screen">
    <div class="top">
      <div class="row"><button class="link back-btn" id="cardBack">‹ Contacts</button><span></span></div>
      <div class="avatar big" id="cardAvatar"></div>
      <div class="c-name" id="cardName"></div>
      <div class="actions">
        <button class="act" id="actMsg"><span>💬</span>message</button>
        <button class="act off"><span>📞</span>call</button>
        <button class="act off"><span>🎥</span>video</button>
        <button class="act off"><span>✉️</span>mail</button>
      </div>
    </div>
    <div class="fields" id="cardFields"></div>
  </section>

  <!-- MESSAGES (thread list) -->
  <section id="messages" class="screen">
    <div class="navbar">
      <div class="row"><button class="link back-btn">‹ Home</button><span></span></div>
      <h1>Messages</h1>
    </div>
    <div class="list" id="threadList"></div>
  </section>

  <!-- CHAT -->
  <section id="chat" class="screen">
    <div class="chathead">
      <button class="link back-btn" id="chatBack">‹</button>
      <div class="avatar" id="chatAvatar" style="cursor:pointer"></div>
      <div id="chatWho" style="cursor:pointer"><div class="who" id="chatName"></div><div class="status" id="status"></div></div>
    </div>
    <div id="msgs"></div>
    <div id="gpsbar"><span class="dot"></span><span id="gpstext">Sharing location with Paddy</span><button id="imhere">I'm here</button></div>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="Text Message"></textarea>
      <button id="send" disabled>↑</button>
    </div>
  </section>

  <div id="banner"><div class="ico">💬</div><div><div class="b-title" id="bTitle"></div><div class="b-text" id="bText"></div></div></div>
  <div id="homebar"><i></i></div>
</div>

<div id="debug"></div>

<script>
/* =====================================================================
   GAME CONFIG — everything you may want to tweak is here
   ===================================================================== */
const CONFIG = {
  PASSCODE: "7752",

  // Sam Fiszman's words, as on the plaque in Sam Fiszman Park.
  // Matching ignores case, punctuation and "I'm"/"I am", accepts extra words
  // around the quote, and forgives small typos (QUOTE_TOLERANCE = share of
  // characters that may differ: 0.15 ≈ 7 letters on this quote).

function show(id){
  current = id;
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active", s.id===id));
  const hb = $("homebar");
  hb.style.display = (id==="lock") ? "none" : "flex";
  hb.classList.toggle("light", id==="home");
  if(id!=="chat") chatWith = null;
}

/* ================== LOCK SCREEN ================== */
function tickClock(){
  const d = new Date();
  $("clock").textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2,"0");
  $("date").textContent = d.toLocaleDateString("en-AU",{weekday:"long", day:"numeric", month:"long"});
  $("wDay").textContent = d.toLocaleDateString("en-AU",{weekday:"long"});
  $("wDate").textContent = d.toLocaleDateString("en-AU",{day:"numeric", month:"long"});
}
tickClock(); setInterval(tickClock, 10000);

let entry = "";
["1","2","3","4","5","6","7","8","9","","0","del"].forEach(k=>{
  const b = document.createElement("button");
  if(k===""){ b.className="blank"; }
  else if(k==="del"){ b.className="del"; b.textContent="Delete"; b.onclick=()=>{ entry=entry.slice(0,-1); renderDots(); }; }
  else { b.textContent=k; b.onclick=()=>press(k); }
  $("pad").appendChild(b);
});
function renderDots(){ [...$("dots").children].forEach((s,i)=>s.classList.toggle("on", i<entry.length)); }
function press(k){
  if(entry.length>=4) return;
  entry += k; renderDots();
  if(entry.length===4){
    setTimeout(()=>{
      if(entry===CONFIG.PASSCODE){ state.unlocked=true; save(); resetNav(); }
      else { $("dots").classList.add("shake"); if(navigator.vibrate) navigator.vibrate(200);
             setTimeout(()=>{ $("dots").classList.remove("shake"); entry=""; renderDots(); },400); }
    },150);
  }
}

  {name:"Photos",   icon:"🌸", bg:"#fff"},
  {name:"Camera",   icon:"📷", bg:"linear-gradient(#d9d9de,#a9a9b0)"},
  {name:"Maps",     icon:"🗺️", bg:"linear-gradient(#b7f0a8,#7ccf6c)"},

  {name:"Clock",    icon:"🕰️", bg:"#1c1c1e"},

  {name:"Calendar", icon:"📅", bg:"#fff"},
  {name:"Settings", icon:"⚙️", bg:"linear-gradient(#b0b0b6,#86868c)"}
];
const DOCK = [

  {name:"Safari",   icon:"🧭", bg:"#fff"},

  {name:"Contacts", icon:"👤", bg:"linear-gradient(#d8d8dd,#b9b9bf)", open:()=>go("contacts")}

function buildApp(a){
  const el = document.createElement("button"); el.className="app";
  el.innerHTML = `<div class="ico" style="background:${a.bg}">${a.icon}</div><div class="lbl">${a.name}</div>${a.badge?'<span class="appbadge" id="msgBadge"></span>':""}`;
  el.onclick = ()=>{ if(a.open) a.open(); else { el.classList.remove("wiggle"); void el.offsetWidth; el.classList.add("wiggle"); } };
  return el;
}
APPS.forEach(a=>$("appGrid").appendChild(buildApp(a)));
DOCK.forEach(a=>$("dock").appendChild(buildApp(a)));

function refreshBadge(){
  const b = $("msgBadge"); if(!b) return;
  b.textContent = state.unread; b.style.display = state.unread ? "flex" : "none";
}
function goHome(){ refreshBadge(); show("home"); }

// Home indicator: tap or swipe up to go home
(function(){
  const hb = $("homebar"); let y0 = null;
  hb.addEventListener("click", ()=>{ if(current!=="lock") resetNav(); });
  hb.addEventListener("touchstart", e=>{ y0 = e.touches[0].clientY; }, {passive:true});
  hb.addEventListener("touchend", e=>{ if(y0!==null && y0 - e.changedTouches[0].clientY > 15 && current!=="lock") resetNav(); y0=null; });
})();

/* ================== CONTACTS APP ================== */
function sortKey(p){ return (p.company ? p.first : (p.last && /^[A-Z]/.test(p.last) ? p.last : p.first)).toUpperCase(); }
function renderContacts(q=""){
  const list = $("contactList"); list.innerHTML = "";
  const nq = q.trim().toLowerCase();
  const people = PEOPLE.filter(p => !nq || fullName(p).toLowerCase().includes(nq) || p.phone.replace(/\s/g,"").includes(nq.replace(/\s/g,"")))
                       .sort((a,b)=>sortKey(a).localeCompare(sortKey(b)));
  if(!people.length){ list.innerHTML = `<div class="empty">No Results</div>`; return; }
  let letter = "";
  people.forEach(p=>{
    const L = sortKey(p)[0];
    if(L!==letter && !nq){ letter=L; const s=document.createElement("div"); s.className="section"; s.textContent=L; list.appendChild(s); }
    const r = document.createElement("div"); r.className="crow";
    r.innerHTML = p.company ? `<b>${p.first}</b>` : (p.last && /^[A-Z]/.test(p.last) ? `${p.first} <b>${p.last}</b>` : `<b>${p.first}</b> ${p.last}`);
    r.onclick = ()=>go("card", p.id);
    list.appendChild(r);
  });
}
$("csearch").addEventListener("input", e=>renderContacts(e.target.value));
function openContacts(fresh){ if(fresh) $("csearch").value=""; renderContacts($("csearch").value); show("contacts"); }

function openCard(id){
  const p = P(id);
  $("cardAvatar").textContent = initials(p);
  $("cardName").textContent = fullName(p);
  let html = `<div class="field"><div class="f-label">mobile</div><div class="f-value">${p.phone}</div></div>`;
  if(p.notes) html += `<div class="field"><div class="f-label">Notes</div><div class="f-value plain">${p.notes}</div></div>`;
  $("cardFields").innerHTML = html;
  $("actMsg").onclick = ()=>go("chat", id);
  show("card");
}

/* ================== MESSAGES APP ================== */
function threadMsgs(id){
  if(id==="paddy") return state.paddy;
  return [...(SEED_THREADS[id]?.msgs||[]), ...(state.extra[id]||[])];
}
function openMessages(){
  const list = $("threadList"); list.innerHTML = "";
  const ids = [];
  if(state.paddy.length) ids.push("paddy");
  Object.keys(state.extra).forEach(id=>{ if(!ids.includes(id) && !SEED_THREADS[id]) ids.push(id); });
  Object.keys(SEED_THREADS).forEach(id=>ids.push(id));
  ids.forEach(id=>{
    const p = P(id); const msgs = threadMsgs(id).filter(m=>m.t!=="sys");
    const last = msgs[msgs.length-1];
    const r = document.createElement("div");
    r.className = "thread" + (id==="paddy" && state.unread ? " unread" : "");
    r.innerHTML = `<span class="unread-dot"></span><div class="avatar">${initials(p)}</div>
      <div class="t-main"><div class="t-top"><span class="t-name">${fullName(p)}</span><span class="t-time">${id==="paddy"||state.extra[id]?"Now":SEED_THREADS[id].time}</span></div>
      <div class="t-last"></div></div>`;
    r.querySelector(".t-last").textContent = last ? (last.t==="me"?"You: ":"") + last.text : "";
    r.onclick = ()=>go("chat", id);
    list.appendChild(r);
  });
  show("messages");
}

/* ================== CHAT ================== */
function openChat(id){
  const p = P(id);
  $("chatAvatar").textContent = initials(p);
  $("chatName").textContent = fullName(p);
  $("status").textContent = id==="paddy" ? "Bondi" : "";
  show("chat"); chatWith = id;
  if(id==="paddy"){ state.unread = 0; save(); }
  $("msgs").innerHTML = "";
  threadMsgs(id).forEach(m=>drawMsg(m,false));
  updateStageUI();
  scrollDown();
}
$("chatAvatar").onclick = $("chatWho").onclick = ()=>{ if(chatWith) go("card", chatWith); };

/* ================== NAVIGATION STACK ==================
   Every screen change goes through go(); back() always returns to the previous
   screen. The browser / Android back button is wired to the same stack. */
let stack = [];
let histOK = true, ignorePop = 0;
const BACK_LABEL = {home:"Home", contacts:"Contacts", messages:"Messages", card:"Contact", chat:"Back"};
function render(e, fresh){
  if(e.name==="home") goHome();
  else if(e.name==="contacts") openContacts(fresh);
  else if(e.name==="card") openCard(e.arg);
  else if(e.name==="messages") openMessages();
  else if(e.name==="chat") openChat(e.arg);
  const prev = stack[stack.length-2];
  document.querySelectorAll(".back-btn").forEach(b=>{ b.textContent = "‹ " + (prev ? BACK_LABEL[prev.name] : "Home"); });
}
function pushHist(){ try{ history.pushState({d:stack.length}, ""); }catch(e){ histOK = false; } }
function go(name, arg){
  const top = stack[stack.length-1];
  if(top && top.name===name && top.arg===arg) return;
  stack.push({name, arg}); render(stack[stack.length-1], true); pushHist();
}
function back(){
  if(stack.length<=1){ resetNav(); return; }
  stack.pop(); render(stack[stack.length-1], false);
  if(histOK){ ignorePop++; history.back(); }
}
function resetNav(){ stack = [{name:"home"}]; render(stack[0]); pushHist(); }
window.addEventListener("popstate", ()=>{
  if(ignorePop){ ignorePop--; return; }
  if(current==="lock") return;
  if(stack.length>1){ stack.pop(); render(stack[stack.length-1], false); }
  else { pushHist(); }   // already home: stay inside the phone
});
document.querySelectorAll(".back-btn").forEach(b=>b.onclick = back);

function drawMsg(m, animate=true){
  const box = $("msgs");
  if(m.t==="me"||m.t==="them"){
    const d = document.createElement("div"); d.className="bubble "+m.t;
    if(m.img){ const im=document.createElement("img"); im.src=IMAGES[m.img]; im.alt=""; im.onload=scrollDown; d.classList.add("photo"); d.appendChild(im); }
    else if(m.link){ const a=document.createElement("a"); a.href=m.link; a.target="_blank"; a.rel="noopener"; a.textContent=m.text; d.appendChild(a); }
    else d.textContent = m.text;
    if(!animate) d.style.animation="none";
    box.appendChild(d);
    if(m.failed){ const f=document.createElement("div"); f.className="failed"; f.textContent="Not Delivered"; box.appendChild(f); }
  } else if(m.t==="sys"){
    const d = document.createElement("div"); d.className="sysnote"; d.textContent=m.text; box.appendChild(d);
  }
  scrollDown();
}
function scrollDown(){ const b=$("msgs"); b.scrollTop=b.scrollHeight; }

function pushPaddy(m){
  state.paddy.push(m);
  const visible = chatWith==="paddy";
  if(!visible && m.t==="them"){ state.unread++; notify(m.text); }
  save(); refreshBadge();
  if(visible) drawMsg(m);
}

/* ---------- notification banner ---------- */
let bannerTimer = null;
function notify(text){
  $("bTitle").textContent = "Paddy Keogh"; $("bText").textContent = text;
  $("banner").classList.add("show");
  clearTimeout(bannerTimer); bannerTimer = setTimeout(()=>$("banner").classList.remove("show"), 4500);
}
$("banner").onclick = ()=>{ $("banner").classList.remove("show"); if(current!=="lock") go("chat","paddy"); };

// Paddy types a sequence of lines with realistic delays
let busy = false;
async function paddySays(lines){
  busy = true; $("status").textContent = "typing…";
  for(const line of lines){
    const obj = typeof line==="string" ? {t:"them", text:line} : Object.assign({t:"them", text: line.img ? "📷 Photo" : ""}, line);
    let typing = null;
    if(chatWith==="paddy"){ typing = document.createElement("div"); typing.className="typing"; typing.innerHTML="<i></i><i></i><i></i>"; $("msgs").appendChild(typing); scrollDown(); }
    await sleep(Math.min(700 + obj.text.length*28, 3200));
    if(typing) typing.remove();
    pushPaddy(obj);
    if(navigator.vibrate) navigator.vibrate(40);
    await sleep(350);
  }
  if(chatWith==="paddy") $("status").textContent = "Bondi";
  busy = false;
}

/* ---------- composer ---------- */
const input = $("input");
input.addEventListener("input", ()=>{ $("send").disabled = !input.value.trim(); input.style.height="auto"; input.style.height=input.scrollHeight+"px"; });
input.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendMsg(); } });
$("send").onclick = sendMsg;

async function sendMsg(){
  const text = input.value.trim(); if(!text) return;
  const to = chatWith;
  if(to!=="paddy"){
    // Other contacts: message just fails to deliver
    input.value=""; input.style.height="auto"; $("send").disabled=true;
    const m = {t:"me", text, failed:true};
    (state.extra[to] = state.extra[to] || []).push(m); save(); drawMsg(m);
    return;
  }
  if(busy) return;
  input.value=""; input.style.height="auto"; $("send").disabled=true;
  pushPaddy({t:"me", text});
  await sleep(600);

  if(state.stage==="quote"){
    if(matchesQuote(text)){
      state.stage = "location"; save();
      await paddySays(PADDY.accepted);
      updateStageUI();
    } else {
      const line = PADDY.wrong[Math.min(state.wrongCount, PADDY.wrong.length-1)];
      state.wrongCount++; save();
      await paddySays([line]);
    }
  } else if(state.stage==="location"){
    await paddySays(["Share your location first."]);
  } else if(state.stage==="travelling"){
    await paddySays(isHelp(text) ? PADDY.help : [PADDY.travelling]);
  } else if(state.stage==="verify"){
    await paddySays(isHelp(text) ? PADDY.checkHelp : [PADDY.checkTravelling]);
  } else {
    await paddySays([PADDY.afterEnd]);
  }
}

/* ---------- help requests while looking for the meeting point ---------- */
function isHelp(text){
  const t = " " + norm(text).replace(/\s+/g," ") + " ";
  return text.includes("?") || CONFIG.HELP_WORDS.some(w => t.includes(" " + w));
}

/* ---------- fuzzy keyword matching ---------- */
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9\s]/g," "); }
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}
function canon(t){
  return norm(t.replace(/&/g," and ").replace(/[’']/g,"'"))
    .replace(/\bi\s*m\b/g,"i am").replace(/\bim\b/g,"i am")
    .split(/\s+/).filter(Boolean);
}
function matchesQuote(text){
  const target = canon(CONFIG.QUOTE), words = canon(text);
  const goal = target.join(" "), maxErr = Math.round(goal.length * CONFIG.QUOTE_TOLERANCE);
  const n = target.length;
  // compare the quote against every window of the message of similar length
  for(let len=Math.max(1,n-2); len<=n+2; len++){
    for(let i=0; i+len<=words.length; i++){
      if(lev(words.slice(i,i+len).join(" "), goal) <= maxErr) return true;
    }
  }
  return false;
}

/* ================== GEOLOCATION ================== */
let watchId = null, wakeLock = null, lastFix = null;

function updateStageUI(){
  document.querySelectorAll("#msgs .action").forEach(b=>b.remove());
  const inPaddy = chatWith==="paddy";
  $("gpsbar").style.display = (inPaddy && walking()) ? "flex" : "none";
  if(inPaddy && state.stage==="location"){
    const b = document.createElement("button"); b.className="action"; b.textContent="📍 Share Live Location";
    b.onclick = requestLocation; $("msgs").appendChild(b); scrollDown();
  }
  if(walking()) startWatch();
}

function requestLocation(){
  if(!("geolocation" in navigator)){ alert("Location isn't available on this device."); return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    pushPaddy({t:"sys", text:"You are sharing your live location with Paddy. Keep this screen open."});
    state.stage = "travelling"; save();
    updateStageUI();
    await paddySays(PADDY.locationOk);
    checkPosition(pos);
  }, async ()=>{ await paddySays(PADDY.locationDenied); },
  {enableHighAccuracy:true, timeout:15000, maximumAge:0});
}

function startWatch(){
  if(watchId!==null || !("geolocation" in navigator)) return;
  watchId = navigator.geolocation.watchPosition(checkPosition, ()=>{
    $("gpstext").textContent = "Location unavailable — tap “I'm here”";
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
  keepAwake();
}
function stopWatch(){ if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; } releaseAwake(); }
async function keepAwake(){ try{ if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){} }
function releaseAwake(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock=null; }
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible" && walking()){ keepAwake(); if(watchId===null) startWatch(); }
});

function distance(a,b){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function checkPosition(pos){
  if(!walking()) return;
  lastFix = pos;
  const {pt, r} = currentTarget();
  const d = distance({lat:pos.coords.latitude, lng:pos.coords.longitude}, pt);
  debugInfo(`${state.stage} · dist ${Math.round(d)} m · accuracy ±${Math.round(pos.coords.accuracy||0)} m`);
  if(d <= r) arrive();
}

$("imhere").onclick = ()=>{
  $("gpstext").textContent = "Checking your position…";
  navigator.geolocation.getCurrentPosition(pos=>{
    checkPosition(pos);
    if(walking()){
      const d = Math.round(distance({lat:pos.coords.latitude,lng:pos.coords.longitude}, currentTarget().pt));
      $("gpstext").textContent = "Sharing location with Paddy";
      const v = state.stage==="verify";
      paddySays([ d>400 ? (v ? PADDY.checkNotHereFar : PADDY.notHereFar) : (v ? PADDY.checkNotHereNear : PADDY.notHereNear) ]);
    }
  }, ()=>{ $("gpstext").textContent = "Location unavailable — check your settings"; },
  {enableHighAccuracy:true, timeout:15000, maximumAge:0});
};

let arriving = false;
async function arrive(){
  if(arriving || !walking()) return;
  arriving = true;
  if(state.stage==="travelling"){
    // Frangipani Girl reached -> security check at the Homestead site (location sharing continues)
    state.stage = "verify"; save();
    await paddySays(PADDY.arrived);
  } else {
    state.stage = "done"; save(); stopWatch(); updateStageUI();
    await paddySays([...PADDY.verified, {text:"🔗 " + CONFIG.NEXT_LINK_LABEL, link:CONFIG.NEXT_LINK}]);
  }
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
  arriving = false;
}

/* ================== DEBUG MODE (add ?debug=1 to the URL) ================== */
const DEBUG = new URLSearchParams(location.search).has("debug");
function debugInfo(t){ if(DEBUG){ const i=document.querySelector("#debug .info"); if(i) i.textContent=t; } }
if(DEBUG){
  const dbg = $("debug"); dbg.style.display="flex";
  dbg.innerHTML = `<div class="info">debug mode · stage: ${state.stage}</div>`;
  [["Reset game",()=>{ try{localStorage.removeItem(CONFIG.STORAGE_KEY);}catch(e){} location.reload(); }],
   ["Skip lock",()=>{ state.unlocked=true; save(); resetNav(); }],
   ["Simulate arrival",()=>{ if(!walking()){ state.stage="travelling"; save(); } arrive(); }],
   ...[100,40,10].map(m=>[`Fake ${m} m`,()=>{
      if(!walking()){ state.stage="travelling"; save(); updateStageUI(); }
      const {pt} = currentTarget();
      checkPosition({coords:{latitude:pt.lat + m/111320, longitude:pt.lng, accuracy:8}});
   }]),
   ["Stage info",()=>debugInfo("stage: "+state.stage + (lastFix? ` · last fix ±${Math.round(lastFix.coords.accuracy)} m`:""))]
  ].forEach(([label,fn])=>{ const b=document.createElement("button"); b.textContent=label; b.onclick=fn; dbg.appendChild(b); });
}

/* ================== BOOT ================== */
if(state.unlocked) resetNav();
if(walking()) startWatch();
</script>
